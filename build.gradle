plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

def buildOutput = providers.gradleProperty('buildOutput')
if (buildOutput.isPresent()) {
    layout.buildDirectory.set(file(buildOutput.get()))
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.8')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
